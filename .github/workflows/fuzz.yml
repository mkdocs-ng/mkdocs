# Runs the Atheris fuzz targets in fuzz/ once a week. A failure means a fuzzer
# found an input that crashes MkDocs: the input is attached to the run as an
# artifact, and `python fuzz/<target>.py <file>` replays it.
name: Fuzz
on:
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_page, fuzz_urls]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r .github/requirements/fuzz.txt
          python -m pip install --no-deps -e .
      - name: Fuzz for 10 minutes
        run: |
          mkdir findings
          python fuzz/${{ matrix.target }}.py -max_total_time=600 -artifact_prefix=findings/
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-findings
          path: findings/
