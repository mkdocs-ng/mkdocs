name: Draft Release Notes

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/about/release-notes.md"
      - ".github/workflows/release-drafter.yml"
      - ".github/scripts/sync_release_draft.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - id: notes
        name: Extract latest release notes
        run: python .github/scripts/sync_release_draft.py
      - name: Show next version
        env:
          RELEASE_VERSION: ${{ steps.notes.outputs.version }}
          RELEASE_TAG: ${{ steps.notes.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.notes.outputs.release_name }}
          RELEASE_BODY_PATH: ${{ steps.notes.outputs.body_path }}
        run: |
          echo "Next version: ${RELEASE_VERSION}"
          {
            echo "## Draft Release"
            echo
            echo "- Next version: \`${RELEASE_VERSION}\`"
            echo "- Draft release tag: \`${RELEASE_TAG}\`"
            echo "- Draft release title: \`${RELEASE_NAME}\`"
            echo "- Release notes source: \`docs/about/release-notes.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update draft release with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.notes.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.notes.outputs.release_name }}
          RELEASE_BODY_PATH: ${{ steps.notes.outputs.body_path }}
        run: |
          state=$(gh release view "$RELEASE_TAG" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)
          if [ "$state" = published ]; then
            # Editing the notes of a released version must not turn it back into a draft.
            echo "${RELEASE_TAG} is already published; nothing to draft." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$state" = draft ]; then
            gh release edit "$RELEASE_TAG" \
              --draft \
              --title "$RELEASE_NAME" \
              --notes-file "$RELEASE_BODY_PATH"
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --target main \
              --title "$RELEASE_NAME" \
              --notes-file "$RELEASE_BODY_PATH"
          fi

          release_url="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
          echo "Draft release URL: ${release_url}"
          {
            echo "- Draft release tag: \`${RELEASE_TAG}\`"
            echo "- Draft release URL: ${release_url}"
          } >> "$GITHUB_STEP_SUMMARY"
