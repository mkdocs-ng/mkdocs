site_name: MkDocs NG
site_url: https://mkdocs-ng.github.io/mkdocs/
site_description: Write Markdown. Ship docs. The maintained MkDocs that keeps your plugins working.
site_author: MkDocs NG Team

repo_url: https://github.com/mkdocs-ng/mkdocs/
edit_uri: blob/main/docs/

theme:
  name: sumi
  logo: img/logo.svg
  logo_dark: img/logo-dark.svg
  favicon: img/favicon.svg
  # Brand blue; docs/css/extra.css sets a lighter blue for the dark palette.
  accent: "#0061fe"

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide: user-guide/
  - Developer Guide: dev-guide/
  - About:
    - Release Notes: about/release-notes.md
    - Fixed Upstream Issues: about/fixed-upstream-issues.md
    - Comparison: about/comparison.md
    - Contributing: about/contributing.md
    - License: about/license.md

extra_css:
  - css/extra.css

exclude_docs: |
  *.py

markdown_extensions:
  - toc:
      permalink: 
  - attr_list
  - def_list
  - tables
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.superfences
  - callouts
  - mdx_gh_links:
      user: mkdocs-ng
      repo: mkdocs
  - mkdocs-click

copyright: Copyright &copy; 2014 <a href="https://twitter.com/starletdreaming">Tom Christie</a>, Maintained by the <a href="https://github.com/mkdocs-ng">MkDocs NG Team</a>.

hooks:
  - docs/hooks.py

plugins:
  - search
  - sumi
  - llms_txt
  - redirects:
      redirect_maps:
        user-guide/plugins.md: dev-guide/plugins.md
        user-guide/custom-themes.md: dev-guide/themes.md
        user-guide/styling-your-docs.md: user-guide/choosing-your-theme.md
  - autorefs
  - literate-nav:
      nav_file: README.md
      implicit_index: true
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_section_style: list
            members_order: source
            show_root_heading: true
            show_source: false
            show_signature_annotations: true

watch:
  - mkdocs
